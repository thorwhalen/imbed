[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "imbed"
version = "0.0.27"
description = "Tools to work with embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "embeddings",
    "nlp",
    "clustering",
    "umap",
    "retrieval",
    "machine-learning",
    "ai",
]
authors = [
    { name = "Thor Whalen" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "dol",
    "config2py",
    "graze",
    "lkj",
    "umap-learn",
    # numba is pulled in transitively by umap-learn/pynndescent, but it must be
    # named here so the resolver gives it the same priority as numpy. numba caps
    # numpy (0.66 requires numpy<2.5); numpy is a direct dependency above, so a
    # resolver that decides numpy first pins it to the newest release and then
    # satisfies "numba" by walking back to 0.53.1 (2021) — the last numba with no
    # numpy ceiling. That version has no wheels for Python >= 3.10 and its pinned
    # llvmlite 0.36 refuses to build there, so the install dies before any test
    # runs. The floor is the first numba shipping wheels for every Python imbed
    # supports (requires-python >= 3.10); it makes numba's own numpy ceiling
    # govern the solve, and lifts on its own once numba supports a newer numpy.
    "numba>=0.59",
    "tabled",
    "oa",
    "au",
    "dill",
]

[project.urls]
Homepage = "https://thorwhalen.github.io/imbed/"
Repository = "https://github.com/thorwhalen/imbed"
Issues = "https://github.com/thorwhalen/imbed/issues"
Changelog = "https://github.com/thorwhalen/imbed/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "imbed",
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = "imbed"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = [
    "OPENAI_API_KEY",
]
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
# Heavy native deps (umap-learn, scikit-learn, numba) don't install cleanly on
# the Windows runner; Windows tests were a non-blocking failure. Disable them.
test_on_windows = false

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
